name: Verify and publish research site
on:
  push:
    branches: [arena/01a0e019-gemsdoe9]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gems9-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify research code
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Refresh public leaderboard feed (fail closed)
        run: python scripts/refresh_feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
