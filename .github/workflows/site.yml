name: Verify research site
on:
  push:
    branches: [arena/01a0e019-gemsdoe9, main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify research code
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Refresh public leaderboard feed (fail closed)
        run: python scripts/refresh_feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-site
          path: docs
  # GitHub Pages environment in this repo is restricted to main. Branch CI
  # must not request it or the job is rejected before any steps run.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: research-site
          path: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
